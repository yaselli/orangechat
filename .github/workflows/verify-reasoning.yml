name: Verify reasoning compatibility

on:
  pull_request:
    branches: [build/stable-release]
    paths:
      - "ai/**"
      - "app/src/main/java/me/rerere/rikkahub/data/ai/transformers/**"
      - "app/src/test/java/me/rerere/rikkahub/data/ai/transformers/**"
      - ".github/workflows/verify-reasoning.yml"

permissions:
  contents: read

concurrency:
  group: reasoning-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download color utilities
        run: git submodule update --init --depth 1 material3/material-color-utilities
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test provider parsing and message transformers
        run: |
          chmod +x gradlew
          ./gradlew :ai:testDebugUnitTest :app:testDebugUnitTest --continue
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-test-results
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: warn
