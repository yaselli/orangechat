name: Build Personal APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/liquid-glass-ui

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4
      - name: Download color utilities
        run: git submodule update --init --depth 1 material3/material-color-utilities

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Allow Gradle to run
        run: chmod +x gradlew

      - name: Restore shared debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub Actions secret: ANDROID_DEBUG_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
          keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey

      - name: Unit tests
        shell: bash
        run: |
          mkdir -p verification-logs
          ./gradlew testDebugUnitTest --continue 2>&1 | tee verification-logs/unit-tests.txt

      - name: Upload unit test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: OrangeChat-unit-test-diagnostics
          path: |
            verification-logs/unit-tests.txt
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: warn

      - name: Android Lint
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug

      - name: Upload verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: OrangeChat-verification-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results*.*
          if-no-files-found: warn

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrangeChat-personal-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
