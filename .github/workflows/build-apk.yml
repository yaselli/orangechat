name: Build Personal APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/liquid-glass-ui
      - refactor/shared-generation-turn
      - refactor/shared-tool-loop
      - refactor/generation-message-updates
      - fix/mixed-tool-approval
      - fix/assistant-settings-writes
      - fix/plugin-file-boundaries
      - feature/raw-audio-messages
      - feature/memory-system
      - fix/memory-evidence-recall
      - fix/workflow-mcp-release-diagnostics
      - build/stable-release
      - fix/upstream-alignment-batch1
      - fix/gemini-proactive-turn
      - feature/shared-music-multiuser
      - feature/upstream-usage-stats
      - feature/upstream-usage-dashboard

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/build/stable-release' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: Verify accepted code and prior full checks
        id: accepted
        if: github.event_name == 'push' && github.ref == 'refs/heads/build/stable-release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-approved-update.py --check-rebuild --channel debug >> "$GITHUB_OUTPUT"
      - name: Download color utilities
        run: git submodule update --init --depth 1 material3/material-color-utilities

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Check web types
        working-directory: web-ui
        run: pnpm run typecheck

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Allow Gradle to run
        run: chmod +x gradlew

      - name: Restore shared debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub Actions secret: ANDROID_DEBUG_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
          keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey

      - name: Set up Python for QQ music service
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/shared-music/requirements.txt
      - name: Install QQ music protocol SDK
        run: python -m pip install -r services/shared-music/requirements.txt

      - name: Verify shared music user isolation
        working-directory: services/shared-music
        run: |
          npm ci --ignore-scripts
          QQ_PYTHON=python npm test
          python -m unittest discover -s test -p 'test_qq_worker.py' -v

      - name: Verify combined music service container
        if: github.ref == 'refs/heads/feature/shared-music-multiuser'
        run: |
          docker build -t watermelon-music-check services/shared-music
          docker run --rm watermelon-music-check /opt/qq-python/bin/python -c "from qqmusic_api import __version__; assert __version__ == '0.7.3'"

      - name: Package self-hosted music service
        run: git archive --format=zip --output=watermelon-music-service.zip HEAD:services/shared-music
      - name: Upload self-hosted music service
        uses: actions/upload-artifact@v4
        with:
          name: WatermelonChat-music-service
          path: watermelon-music-service.zip
          if-no-files-found: error

      - name: Unit tests
        if: steps.accepted.outputs.approved != 'true'
        shell: bash
        run: |
          mkdir -p verification-logs
          ./gradlew testDebugUnitTest --continue 2>&1 | tee verification-logs/unit-tests.txt

      - name: Upload generated Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-v43-debug
          path: app/schemas/me.rerere.rikkahub.data.db.AppDatabase/43.json
          if-no-files-found: error
      - name: Verify usage accounting SQL and migration
        run: |
          python3 scripts/verify-usage-stats.py
          python3 scripts/verify-conversation-config.py
          python3 scripts/verify-ssh-workspace.py --require-schema
          python3 scripts/verify-media-creation.py
          python3 scripts/verify-translation-history.py

      - name: Verify memory database migration SQL
        run: python3 scripts/verify-memory-migration.py

      - name: Verify history memory SQL and source isolation
        run: python3 scripts/verify-history-memory.py

      - name: Verify automatic memory claims and evidence
        run: python3 scripts/verify-memory-organization.py

      - name: Verify recall evidence and vector maintenance
        run: python3 scripts/verify-memory-recall-evidence.py

      - name: Verify graph retirement and incremental index claims
        run: python3 scripts/verify-memory-graph.py

      - name: Verify message search index upgrade
        run: python3 scripts/verify-message-fts.py

      - name: Compile memory device tests
        if: steps.accepted.outputs.approved != 'true'
        run: ./gradlew :app:compileDebugAndroidTestKotlin

      - name: Enable KVM for shared music playback tests
        if: github.ref == 'refs/heads/feature/shared-music-multiuser'
        run: sudo chmod 666 /dev/kvm
      - name: Verify shared music background playback on Android
        if: github.ref == 'refs/heads/feature/shared-music-multiuser'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=me.rerere.rikkahub.data.music.MusicPlayerDeviceTest

      - name: Upload unit test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: OrangeChat-unit-test-diagnostics
          path: |
            verification-logs/unit-tests.txt
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: warn

      - name: Android Lint
        if: ${{ !cancelled() && steps.accepted.outputs.approved != 'true' }}
        run: ./gradlew lintDebug

      - name: Upload verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: OrangeChat-verification-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results*.*
            app/schemas/**/30.json
            app/schemas/**/31.json
            app/schemas/**/33.json
            app/schemas/**/36.json
            app/schemas/**/37.json
            app/schemas/**/39.json
            app/schemas/**/41.json
            app/schemas/**/43.json
          if-no-files-found: warn

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Verify removed native dependencies and report APK size
        run: python3 scripts/report-apk-size.py --apk-dir app/build/outputs/apk/debug --output app/build/reports/apk-size/debug.json
      - name: Upload APK size report
        uses: actions/upload-artifact@v4
        with:
          name: OrangeChat-apk-size-debug
          path: app/build/reports/apk-size/debug.json
          if-no-files-found: error
      - name: Upload APK
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          python3 scripts/test-prepare-update-assets.py
          python3 scripts/prepare-update-assets.py --apk-dir app/build/outputs/apk/debug --output-dir update-assets/debug --channel debug --aapt "$AAPT"
      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: OrangeChat-personal-debug
          path: update-assets/debug/*
          if-no-files-found: error

  publish-approved-update:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/build/stable-release'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - uses: actions/download-artifact@v4
        with:
          name: OrangeChat-personal-debug
          path: approved-update
      - name: Verify release automation regressions
        run: python3 scripts/test-publish-approved-update.py
      - name: Publish the accepted version after checksum and source verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-approved-update.py --directory approved-update --channel debug
