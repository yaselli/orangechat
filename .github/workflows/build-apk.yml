name: Build Personal APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/liquid-glass-ui
      - refactor/shared-generation-turn
      - refactor/shared-tool-loop
      - refactor/generation-message-updates
      - fix/mixed-tool-approval
      - fix/assistant-settings-writes
      - fix/plugin-file-boundaries
      - feature/raw-audio-messages
      - feature/memory-system
      - fix/memory-evidence-recall
      - fix/workflow-mcp-release-diagnostics
      - build/stable-release
      - fix/upstream-alignment-batch1
      - feature/upstream-usage-stats

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4
      - name: Download color utilities
        run: git submodule update --init --depth 1 material3/material-color-utilities

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Check web types
        working-directory: web-ui
        run: pnpm run typecheck

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Allow Gradle to run
        run: chmod +x gradlew

      - name: Restore shared debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub Actions secret: ANDROID_DEBUG_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
          keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey

      - name: Unit tests
        shell: bash
        run: |
          mkdir -p verification-logs
          ./gradlew testDebugUnitTest --continue 2>&1 | tee verification-logs/unit-tests.txt

      - name: Verify memory database migration SQL
        run: python3 scripts/verify-memory-migration.py

      - name: Verify history memory SQL and source isolation
        run: python3 scripts/verify-history-memory.py

      - name: Verify automatic memory claims and evidence
        run: python3 scripts/verify-memory-organization.py

      - name: Verify recall evidence and vector maintenance
        run: python3 scripts/verify-memory-recall-evidence.py

      - name: Verify graph retirement and incremental index claims
        run: python3 scripts/verify-memory-graph.py

      - name: Verify message search index upgrade
        run: python3 scripts/verify-message-fts.py

      - name: Compile memory device tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin

      - name: Upload unit test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: OrangeChat-unit-test-diagnostics
          path: |
            verification-logs/unit-tests.txt
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: warn

      - name: Android Lint
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug

      - name: Upload verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: OrangeChat-verification-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results*.*
            app/schemas/**/30.json
            app/schemas/**/31.json
            app/schemas/**/33.json
            app/schemas/**/36.json
            app/schemas/**/37.json
          if-no-files-found: warn

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          python3 scripts/test-prepare-update-assets.py
          python3 scripts/prepare-update-assets.py --apk-dir app/build/outputs/apk/debug --output-dir update-assets/debug --channel debug --aapt "$AAPT"
      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: OrangeChat-personal-debug
          path: update-assets/debug/*
          if-no-files-found: error
