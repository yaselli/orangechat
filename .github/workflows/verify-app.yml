name: Verify app changes

on:
  pull_request:
    branches: [build/stable-release]
    paths:
      - "app/**"
      - "ai/**"
      - "common/**"
      - "speech/**"
      - "web/**"
      - "web-ui/**"
      - "document/**"
      - "workspace/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/verify-app.yml"

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download color utilities
        run: git submodule update --init --depth 1 material3/material-color-utilities
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Use the runner's preinstalled Android SDK, as the APK build workflows do.
      - uses: gradle/actions/setup-gradle@v4
      - name: Test app and providers and run Android Lint
        run: |
          chmod +x gradlew
          ./gradlew :ai:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug --continue
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-verification-results
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results*
          if-no-files-found: warn
      - name: Prepare emulator-only test signing and KVM
        if: github.head_ref == 'ui/unified-theme-materials'
        run: |
          sudo chmod 666 /dev/kvm
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore app/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug' -keyalg RSA -validity 10000
          fi
      - name: Verify material colors and navigation backgrounds on Android
        if: github.head_ref == 'ui/unified-theme-materials'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=me.rerere.rikkahub.ui.theme.ThemeMaterialRenderingDeviceTest
      - name: Upload material rendering test results
        if: always() && github.head_ref == 'ui/unified-theme-materials'
        uses: actions/upload-artifact@v4
        with:
          name: theme-material-rendering-results
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: warn
